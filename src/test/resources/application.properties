# Test configuration - overrides for testing
quarkus.http.port=8081
quarkus.http.test-port=8081

# Use H2 for testing
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1

# JWT Configuration for testing - use classpath keys
mp.jwt.verify.issuer=rest-countries
mp.jwt.verify.publickey.location=classpath:publicKey.pem
smallrye.jwt.sign.key.location=classpath:privateKey.pem
smallrye.jwt.sign.issuer=rest-countries
smallrye.jwt.new-token.lifespan=86400000
smallrye.jwt.new-token.claims.groups=USER

# Disable security for testing - allow all endpoints without auth
quarkus.security.jwt.token.header=Authorization

# Disable external API calls in test - use mock URLs that will 404
quarkus.rest-client."com.apitest.countries.service.RestCountriesClient".url=https://api.restcountries.com/countries/v5
quarkus.rest-client."com.apitest.countries.service.JsonPlaceholderClient".url=http://localhost:3000

# Allow all paths for testing (disable security)
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=permit