quarkus.application.name=rest-countries
quarkus.http.port=8080

# Datasource - MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=secret
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/taskdb?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# REST Client Reactive for external APIs
quarkus.rest-client."com.apitest.countries.service.RestCountriesClient".url=https://api.restcountries.com/countries/v5
quarkus.rest-client."com.apitest.countries.service.RestCountriesClient".scope=javax.inject.Singleton
quarkus.rest-client."com.apitest.countries.service.JsonPlaceholderClient".url=http://localhost:3000
quarkus.rest-client."com.apitest.countries.service.JsonPlaceholderClient".scope=javax.inject.Singleton

# JWT Configuration (SmallRye JWT)
mp.jwt.verify.issuer=rest-countries
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.sign.issuer=rest-countries
smallrye.jwt.new-token.lifespan=86400000
smallrye.jwt.new-token.claims.groups=USER

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/v1/api-docs
quarkus.swagger-ui.path=/swagger-ui.html
quarkus.swagger-ui.always-include=true

# Health & Metrics
quarkus.smallrye-health.root-path=/actuator/health
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/actuator/prometheus

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8005
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=Authorization

# Dev mode
quarkus.dev.ui.enabled=true